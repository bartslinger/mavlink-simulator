[package]
name = "mavlink-simulator"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.97"
axum = { version = "0.8.3", features = ["ws"] }
bytes = "1.10.1"
futures-util = "0.3.31"
mavlink = { path = "../rust-mavlink/mavlink", features = ["tokio-1"] }
nalgebra = "0.33.2"
tokio = { version = "1.44.1", features = ["time", "rt-multi-thread", "macros", "sync", "net", "io-util"] }
tower-http = { version = "0.6.2", features = ["cors"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
